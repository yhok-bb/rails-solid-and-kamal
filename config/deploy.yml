# アプリ名。Kamal Proxyがコンテナを識別するために使う
service: chronoshub

# DockerHubのイメージ名（ユーザー名/サービス名）
image: yohei0920/chronoshub

# デプロイ先サーバーのIPアドレス
# アプリとDBを同じDockerネットワーク(chronoshub)に接続する
servers:
  web:
    hosts:
      - 167.179.103.252
      - 108.61.126.182
    env:
      clear:
        DB_HOST: 10.25.96.3

# Kamal Proxyの設定（ポート80/443で受けてコンテナに転送する）
proxy:
  host: tonebyte.net
  ssl:
    certificate_pem: CLOUDFLARE_CERT
    private_key_pem: CLOUDFLARE_KEY

# DockerHubの認証情報
registry:
  username: yohei0920
  password:
    - KAMAL_REGISTRY_PASSWORD

# SSHキーの指定
ssh:
  keys:
    - ~/.ssh/vultr_dashboard_key

# Dockerイメージのビルド設定
builder:
  arch: amd64

# 本番環境の環境変数
env:
  clear:
    RAILS_ENV: production
    RAILS_LOG_TO_STDOUT: "true"
    RAILS_SERVE_STATIC_FILES: "true"
    DB_HOST: 10.25.96.3
  secret:
    - SECRET_KEY_BASE
    - POSTGRES_USER
    - POSTGRES_PASSWORD
    - RAILS_MASTER_KEY
    - CLOUDFLARE_CERT
    - CLOUDFLARE_KEY

# Kamalが管理する周辺サービス（DBなど）
accessories:
  postgres:
    image: postgres:16-alpine
    host: 167.179.103.252
    port: 5432
    env:
      clear:
        POSTGRES_DB: chronos_hub_production
      secret:
        - POSTGRES_USER
        - POSTGRES_PASSWORD
    volumes:
      - postgres_data:/var/lib/postgresql/data
