# アプリ名。Kamal Proxyがコンテナを識別するために使う
service: chronoshub

# DockerHubのイメージ名（ユーザー名/サービス名）
image: yohei0920/chronoshub

# デプロイ先サーバーのIPアドレス
# アプリとDBを同じDockerネットワーク(chronoshub)に接続する
servers:
  web:
    - 45.63.50.33

# Kamal Proxyの設定（ポート80/443で受けてコンテナに転送する）
proxy:
  ssl: true
  host: tonebyte.net

# DockerHubの認証情報
registry:
  username: yohei0920
  password:
    - KAMAL_REGISTRY_PASSWORD

# SSHキーの指定
ssh:
  keys:
    - ~/.ssh/vultr_dashboard_key

# Dockerイメージのビルド設定
builder:
  arch: amd64

# 本番環境の環境変数
env:
  clear:
    RAILS_ENV: production
    RAILS_LOG_TO_STDOUT: "true"
    RAILS_SERVE_STATIC_FILES: "true"
    DB_HOST: chronoshub-postgres  # アクセサリのコンテナ名で接続
  secret:
    - SECRET_KEY_BASE
    - POSTGRES_USER
    - POSTGRES_PASSWORD

# Kamalが管理する周辺サービス（DBなど）
accessories:
  postgres:
    image: postgres:16-alpine
    host: 45.63.50.33
    port: 5432
    env:
      clear:
        POSTGRES_DB: chronos_hub_production
      secret:
        - POSTGRES_USER
        - POSTGRES_PASSWORD
    volumes:
      - postgres_data:/var/lib/postgresql/data
